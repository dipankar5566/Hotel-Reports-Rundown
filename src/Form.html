<!-- Daily-entry PWA client for the Hotel P&L sheets. Served by Main.gs's
     doGet when ?view=entry. Talks to Entry.gs via google.script.run. ES5 to
     match the rest of the project. Online-only v1 (offline queue deferred). -->
<base target="_top">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Entry">
<link rel="apple-touch-icon" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192"><rect width="192" height="192" rx="36" fill="%230f766e"/><text x="96" y="134" font-size="120" text-anchor="middle" fill="%23ffffff" font-family="sans-serif">H</text></svg>'>

<style>
  :root { --teal:#0f766e; --teal2:#115e59; --bg:#f5f5f4; --card:#fff; --line:#e7e5e4; --muted:#78716c; --danger:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:#1c1917; }
  .wrap { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input, select { width:100%; padding:11px 12px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  input:focus, select:focus { outline:2px solid var(--teal); border-color:var(--teal); }
  button { font-size:16px; font-weight:600; border:none; border-radius:8px; padding:12px 16px; cursor:pointer; }
  .primary { background:var(--teal); color:#fff; width:100%; }
  .primary:active { background:var(--teal2); }
  .primary:disabled { opacity:.6; }
  .chips { display:flex; gap:8px; margin-bottom:8px; }
  .chip { flex:1; text-align:center; padding:10px; border:1px solid var(--line); border-radius:8px; background:#fff; font-weight:600; color:var(--muted); }
  .chip.on { background:var(--teal); color:#fff; border-color:var(--teal); }
  .hidden { display:none; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#1c1917; color:#fff; padding:12px 18px; border-radius:10px; font-size:14px; max-width:90%; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  .toast.err { background:var(--danger); }
  .entry { display:flex; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--line); font-size:14px; }
  .entry .grow { flex:1; }
  .entry .day { font-weight:700; min-width:34px; }
  .entry .sec { font-size:11px; text-transform:uppercase; color:var(--muted); }
  .entry .amt { font-variant-numeric:tabular-nums; font-weight:600; }
  .mini { padding:6px 10px; font-size:13px; }
  .mini.del { background:#fee2e2; color:var(--danger); }
  .mini.ed { background:#e7e5e4; color:#1c1917; }
  .muted { color:var(--muted); font-size:13px; }
  .tiles { display:flex; gap:8px; margin:12px 0; }
  .tile { flex:1; background:#f5f5f4; border:1px solid var(--line); border-radius:8px; padding:10px; text-align:center; }
  .tile .k { font-size:11px; text-transform:uppercase; color:var(--muted); }
  .tile .v { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; }
  .tile.out .v { color:var(--danger); }
  table.rep { width:100%; border-collapse:collapse; font-size:13px; }
  table.rep th, table.rep td { padding:6px 4px; text-align:right; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; }
  table.rep th:first-child, table.rep td:first-child { text-align:left; }
  table.rep th { color:var(--muted); font-weight:600; border-top:none; }
  table.rep tr.today td { background:#ecfdf5; font-weight:600; }
  table.rep tr.tot td { border-top:2px solid var(--muted); font-weight:700; }
  .party { padding:10px 0; border-top:1px solid var(--line); cursor:pointer; }
  .party .top { display:flex; align-items:center; gap:8px; }
  .party .nm { flex:1; font-weight:600; }
  .party .ob { font-variant-numeric:tabular-nums; font-weight:700; }
  .party .ob.clear { color:var(--muted); font-weight:600; }
  .party .lines { margin-top:6px; font-size:12px; color:var(--muted); }
  .party .lines .ln { display:flex; justify-content:space-between; padding:2px 0; }
  .party .lines .ln.rec { color:var(--teal); }
  .tablewrap { overflow-x:auto; }
  #duePicker { margin-bottom:14px; padding-bottom:10px; border-bottom:1px dashed var(--line); }
  #dueResults { max-height:220px; overflow-y:auto; }
  #dueResults .party { padding:8px 0; }
  #invResults { max-height:260px; overflow-y:auto; }
  #invResults .party { padding:8px 0; cursor:pointer; }
  #dueLinked { padding:8px 0; font-size:13px; color:var(--muted); }
  #dueLinked a { color:var(--teal); font-weight:600; }
  .entry.low { background:#fef2f2; margin:0 -16px; padding:10px 16px; }
</style>

<div class="wrap">
  <h1>🏨 Daily Entry</h1>

  <!-- ---- PIN / unlock screen ---- -->
  <div id="pinScreen" class="card">
    <label>Hotel</label>
    <select id="hotel">
      <option value="Dream">Dream</option>
      <option value="Paradise">Paradise</option>
    </select>
    <label>PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Enter hotel PIN">
    <label>Your name</label>
    <input id="staffName" type="text" autocomplete="off" placeholder="Who's entering today?">
    <div style="height:14px"></div>
    <button class="primary" id="unlockBtn">Unlock</button>
    <p class="muted" id="pinMsg" style="margin-top:12px"></p>
  </div>

  <!-- ---- entry app ---- -->
  <div id="app" class="hidden">
    <div class="chips" id="navChips">
      <div class="chip on" id="navEntry">Entry</div>
      <div class="chip" id="navInv">Inventory</div>
      <div class="chip" id="navDash">Dashboard</div>
    </div>

    <!-- === ENTRY view === -->
    <div id="entryView">
      <div class="card">
        <div class="chips" id="sectionChips"></div>

        <label>Date</label>
        <input id="entryDate" type="date">

        <div id="fields"></div>

        <div style="height:16px"></div>
        <button class="primary" id="saveBtn">Save entry</button>
        <p class="muted hidden" id="editHint" style="margin-top:10px"></p>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <strong>App entries</strong>
          <button class="mini ed" id="refreshBtn">Refresh</button>
        </div>
        <label>View month</label>
        <select id="listMonth"></select>
        <div id="entries"><p class="muted">—</p></div>
      </div>
    </div>

    <!-- === INVENTORY view === -->
    <div id="invView" class="hidden">
      <div class="card">
        <div class="chips" id="invTypeChips"></div>
        <label>Date</label>
        <input id="invDate" type="date">
        <div id="invFields"></div>
        <div style="height:16px"></div>
        <button class="primary" id="invSaveBtn">Save transaction</button>
      </div>

      <div class="card">
        <div style="display:flex;align-items:center;gap:8px">
          <strong class="grow" style="flex:1">Current stock</strong>
          <button class="mini ed" id="invAddBtn">+ Add new item</button>
        </div>
        <div id="invAddForm" class="hidden" style="margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:8px">
          <label>Item name *</label>
          <input id="f_new_name" type="text" maxlength="60">
          <label>Category *</label>
          <select id="f_new_cat"></select>
          <input id="f_new_cat_other" type="text" maxlength="40" placeholder="New category name" class="hidden" style="margin-top:6px">
          <label>Opening stock (optional)</label>
          <input id="f_new_open" type="number" inputmode="decimal" min="0" placeholder="0">
          <label>Min stock (low-stock alert level)</label>
          <input id="f_new_min" type="number" inputmode="decimal" min="0" value="2">
          <div style="height:12px"></div>
          <button class="primary" id="invAddSave">Add item</button>
          <button class="mini ed" id="invAddCancel" style="margin-top:6px">Cancel</button>
        </div>
        <div id="invItemPanel" class="hidden" style="margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:8px"></div>
        <input id="invStockSearch" type="text" placeholder="Search items…" style="margin:8px 0">
        <div id="invStockList"><p class="muted">—</p></div>
      </div>

      <div class="card">
        <strong>Closing Stock Statement</strong>
        <div id="closeStatus" class="muted" style="margin:8px 0">—</div>
        <button class="primary" id="closeSubmitBtn">Submit closing stock</button>
        <label>Date</label>
        <input id="closeDate" type="date">
        <button class="mini ed" id="closePdfBtn" style="margin-top:8px">Download PDF</button>
        <p class="muted" id="closePdfStatus"></p>
      </div>

      <div class="card">
        <strong>Transaction history</strong>
        <div id="invLog"><p class="muted">—</p></div>
      </div>
    </div>

    <!-- === DASHBOARD view === -->
    <div id="dashView" class="hidden">
      <div class="card">
        <strong>Daily report</strong>
        <label>Month</label>
        <select id="repMonth"></select>
        <button class="mini ed" id="exportBtn" style="margin-top:8px">Download Excel (for CA)</button>
        <p class="muted" id="exportStatus"></p>
        <div id="repTable"><p class="muted">—</p></div>
      </div>

      <div class="card">
        <strong>Due tracker</strong>
        <div class="chips" id="scopeChips" style="margin-top:8px"></div>
        <div id="dueTiles"></div>
        <div id="partyList"><p class="muted">—</p></div>
      </div>
    </div>

    <button class="mini ed" id="lockBtn" style="width:100%">Lock</button>
  </div>
</div>
<datalist id="partiesDatalist"></datalist>

<script>
// ---- inline web-app manifest (installable icon; online-only v1) ----
(function () {
  var icon = document.querySelector('link[rel="apple-touch-icon"]').getAttribute('href');
  var manifest = {
    name: 'Hotel Daily Entry', short_name: 'Daily Entry',
    display: 'standalone', background_color: '#f5f5f4', theme_color: '#0f766e',
    start_url: location.href,
    icons: [{ src: icon, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' }]
  };
  var url = 'data:application/manifest+json;base64,' + btoa(unescape(encodeURIComponent(JSON.stringify(manifest))));
  var link = document.createElement('link');
  link.rel = 'manifest'; link.href = url;
  document.head.appendChild(link);
})();

var STATE = { hotel: null, pin: null, config: null, staffName: null, section: 'rent', editingId: null, editOrigYm: null };

// ---- inventory state (separate from STATE.section's rent/food/expense/recovery
// forms — different shape: no money fields, item picker instead of a fixed
// dropdown, and a live per-hotel stock snapshot rather than a per-month list) ----
var INV_CONFIG = null;
var INV = { type: 'Purchase', stockSearch: '' };

// Field definitions per section. type: text|number|select. req = required.
var FIELD_DEFS = {
  rent: [
    { key: 'room', label: 'Room', type: 'select', src: 'rooms', req: true },
    { key: 'source', label: 'Source', type: 'select', src: 'sources' },
    { key: 'nights', label: 'Nights', type: 'number' },
    { key: 'amount', label: 'Room revenue (Rs)', type: 'number', req: true },
    { key: 'cash', label: 'Cash (Rs)', type: 'number' },
    { key: 'bank', label: 'Banking & UPI (Rs)', type: 'number' },
    { key: 'gst', label: 'GST (Rs)', type: 'number' },
    { key: 'due', label: 'Due (Rs)', type: 'number' },
    { key: 'discount', label: 'Discount (Rs)', type: 'number' },
    { key: 'party', label: 'Guest / party (name a due)', type: 'text' },
    { key: 'remark', label: 'Remark (optional)', type: 'text' }
  ],
  food: [
    { key: 'room', label: 'Room / table', type: 'select', src: 'rooms', req: true },
    { key: 'amount', label: 'Amount (Rs)', type: 'number', req: true },
    { key: 'cash', label: 'Cash (Rs)', type: 'number' },
    { key: 'bank', label: 'Banking & UPI (Rs)', type: 'number' },
    { key: 'due', label: 'Due (Rs)', type: 'number' },
    { key: 'discount', label: 'Discount (Rs)', type: 'number' },
    // Paradise-only: food Paradise recorded that actually came from Dream's
    // kitchen. Pass-through/informational, excluded from the money-hint
    // reconciliation below. hotelOnly filtered in visibleFieldDefs().
    { key: 'dreamFoodAmount', label: 'Dream Food Amount (Rs)', type: 'number', hotelOnly: 'Paradise' },
    { key: 'party', label: 'Guest / party (name a due)', type: 'text' },
    { key: 'remark', label: 'Remark (optional)', type: 'text' }
  ],
  expense: [
    { key: 'category', label: 'Category', type: 'select', src: 'categories', req: true },
    { key: 'amount', label: 'Amount (Rs)', type: 'number', req: true },
    { key: 'remark', label: 'Remark (optional)', type: 'text' }
  ],
  recovery: [
    // dueRef is the hard link (the paid-down rent row's own _entryId) — not
    // staff-typed, only set by picking a row from the open-dues list built by
    // buildDuePicker(). Left blank when staff types the party directly instead
    // (legacy/unlisted due), which is the "Other / not listed" fallback.
    { key: 'dueRef', label: '', type: 'hidden' },
    { key: 'party', label: 'Recovered from (party)', type: 'text', req: true, list: 'partiesDatalist' },
    { key: 'room', label: 'Room (optional)', type: 'select', src: 'rooms' },
    { key: 'amount', label: 'Amount recovered (Rs)', type: 'number', req: true },
    { key: 'cash', label: 'Cash (Rs)', type: 'number' },
    { key: 'bank', label: 'Banking & UPI (Rs)', type: 'number' },
    { key: 'remark', label: 'Remark (optional)', type: 'text' }
  ]
};

// Fields can be hotelOnly (e.g. Paradise's Dream Food Amount) — filter once
// here so buildFields() and collectPayload() never disagree on which fields
// exist for the currently unlocked hotel.
function visibleFieldDefs(section) {
  return FIELD_DEFS[section].filter(function (d) {
    return !d.hotelOnly || d.hotelOnly === STATE.hotel;
  });
}

function $(id) { return document.getElementById(id); }

function toast(msg, isErr) {
  var t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.parentNode && t.parentNode.removeChild(t); }, isErr ? 5000 : 2500);
}

function todayIso() {
  var d = new Date();
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

// ---- unlock ----
$('unlockBtn').onclick = function () {
  var hotel = $('hotel').value, pin = $('pin').value;
  var staffName = ($('staffName').value || '').trim();
  if (!staffName) { $('pinMsg').textContent = 'Enter your name.'; return; }
  $('pinMsg').textContent = 'Checking...';
  $('unlockBtn').disabled = true;
  google.script.run
    .withSuccessHandler(function (cfg) {
      STATE.hotel = hotel; STATE.pin = pin; STATE.config = cfg; STATE.staffName = staffName;
      $('pinMsg').textContent = '';
      $('unlockBtn').disabled = false;
      $('pinScreen').classList.add('hidden');
      $('app').classList.remove('hidden');
      $('entryDate').value = todayIso();
      $('invDate').value = todayIso();
      buildMonthList();
      selectSection('rent');
      loadEntries();
      loadDues(); // primes the recovery party datalist + caches the tracker
      loadInventoryConfig();
    })
    .withFailureHandler(function (err) {
      $('unlockBtn').disabled = false;
      $('pinMsg').textContent = err && err.message ? err.message : String(err);
    })
    .getEntryConfig(hotel, pin);
};

function buildSectionChips() {
  var box = $('sectionChips'); box.innerHTML = '';
  var secs = (STATE.config && STATE.config.sections) || ['rent', 'food', 'expense', 'recovery'];
  secs.forEach(function (sec) {
    var b = document.createElement('div');
    b.className = 'chip' + (sec === STATE.section ? ' on' : '');
    b.textContent = sec.charAt(0).toUpperCase() + sec.slice(1);
    b.onclick = function () { selectSection(sec); };
    box.appendChild(b);
  });
}

function selectSection(sec) {
  STATE.section = sec;
  STATE.editingId = null;
  buildSectionChips();
  buildFields();
  updateSaveLabel();
}

function buildFields(prefill) {
  var box = $('fields'); box.innerHTML = '';
  visibleFieldDefs(STATE.section).forEach(function (def) {
    var el, opts;
    if (def.type === 'hidden') {
      el = document.createElement('input'); el.type = 'hidden';
    } else {
      var lab = document.createElement('label');
      lab.textContent = def.label + (def.req ? ' *' : '');
      box.appendChild(lab);
      if (def.type === 'select') {
        el = document.createElement('select');
        opts = STATE.config[def.src] || [];
        if (!def.req) { var blank = document.createElement('option'); blank.value = ''; blank.textContent = '-'; el.appendChild(blank); }
        opts.forEach(function (o) {
          var op = document.createElement('option'); op.value = o; op.textContent = o; el.appendChild(op);
        });
        // Room list (Config.gs ROOMS_BY_HOTEL) is a fixed placeholder set —
        // an "Other" escape hatch keeps a real, un-listed room from forcing
        // staff to silently pick the wrong one. See f_room_other below.
        if (def.src === 'rooms') {
          var otherOpt = document.createElement('option');
          otherOpt.value = '__other__'; otherOpt.textContent = 'Other (type below)';
          el.appendChild(otherOpt);
        }
      } else {
        el = document.createElement('input');
        el.type = def.type === 'number' ? 'number' : 'text';
        if (def.type === 'number') { el.inputMode = 'decimal'; el.min = '0'; }
        if (def.list) el.setAttribute('list', def.list); // datalist of outstanding parties
      }
    }
    el.id = 'f_' + def.key;
    var pv = prefill && prefill[def.key] !== undefined && prefill[def.key] !== null ? prefill[def.key] : null;
    var needsOther = false;
    if (pv !== null) {
      if (def.type === 'select' && def.src === 'rooms' && opts.indexOf(String(pv)) === -1 && pv !== '') {
        needsOther = true; // stored room isn't in the current list — don't silently fall back to the 1st option
      } else {
        el.value = pv;
      }
    }
    if (needsOther) el.value = '__other__';
    box.appendChild(el);
    if (def.type === 'select' && def.src === 'rooms') {
      var otherInput = document.createElement('input');
      otherInput.type = 'text'; otherInput.id = 'f_' + def.key + '_other';
      otherInput.placeholder = 'Type the room';
      otherInput.className = needsOther || el.value === '__other__' ? '' : 'hidden';
      if (needsOther) otherInput.value = String(pv);
      box.appendChild(otherInput);
      el.onchange = function () {
        otherInput.classList.toggle('hidden', el.value !== '__other__');
      };
    }
  });
  if (STATE.section === 'recovery') buildDuePicker();
  wireMoneyCheck();
}

// Live client-side hint mirroring the server's hard-block invariant
// (Cash+Bank(+Due) must equal Amount — normalizeEntryPayload_ in Entry.gs).
// Pure UX: the server check is what actually blocks a bad save.
function wireMoneyCheck() {
  var sec = STATE.section;
  if (sec !== 'rent' && sec !== 'food' && sec !== 'recovery') return;
  var hint = document.createElement('p');
  hint.id = 'moneyHint';
  hint.className = 'muted hidden';
  hint.style.color = 'var(--danger)';
  $('fields').appendChild(hint);
  var ids = ['f_amount', 'f_cash', 'f_bank'].concat((sec === 'rent' || sec === 'food') ? ['f_due', 'f_discount'] : []);
  ids.forEach(function (id) {
    var el = $(id);
    if (!el) return;
    el.oninput = (sec === 'recovery' && id === 'f_amount')
      ? function () { updateMoneyHint(); updateDueRemainHint(); }
      : updateMoneyHint;
  });
  updateMoneyHint();
  if (sec === 'recovery') updateDueRemainHint();
}

function updateMoneyHint() {
  var sec = STATE.section;
  var hint = $('moneyHint'); if (!hint) return;
  var amt = Number($('f_amount').value) || 0;
  var cash = ($('f_cash') && Number($('f_cash').value)) || 0;
  var bank = ($('f_bank') && Number($('f_bank').value)) || 0;
  var hasDue = sec === 'rent' || sec === 'food';
  var due = (hasDue && $('f_due') && Number($('f_due').value)) || 0;
  var discount = (hasDue && $('f_discount') && Number($('f_discount').value)) || 0;
  var sum = cash + bank + due;
  var target = amt - discount;
  if (!amt && !sum && !discount) { hint.classList.add('hidden'); return; }
  var diff = sum - target;
  if (Math.abs(diff) <= 0.01) { hint.classList.add('hidden'); return; }
  hint.classList.remove('hidden');
  hint.textContent = (hasDue ? 'Cash+Bank+Due' : 'Cash+Bank') + ' = Rs ' + fmt(sum) +
    ', Amount' + (discount ? '−Discount' : '') + ' = Rs ' + fmt(target) +
    ' (' + (diff < 0 ? 'short' : 'over') + ' by Rs ' + fmt(Math.abs(diff)) + ')';
}

// ---- recovery: pick-from-open-dues picker (hard link), not a native <select>
// (which renders as a one-row-at-a-time iOS wheel for more than a few items).
// Search-filters DASH.dues.openDues (already fetched via getDuesTracker on
// unlock/after-save — no extra RPC) and, on tap, fills party/room/amount and
// sets the hidden f_dueRef. Staff can still ignore it and type party directly
// (the "Other / not listed" fallback — dueRef just stays blank).
function buildDuePicker() {
  var box = $('fields');
  var wrap = document.createElement('div'); wrap.id = 'duePicker';
  var lab = document.createElement('label'); lab.textContent = 'Pick the due (optional — search party or room)';
  var search = document.createElement('input'); search.id = 'dueSearch'; search.type = 'text';
  search.placeholder = 'Search open dues…';
  var results = document.createElement('div'); results.id = 'dueResults';
  var linked = document.createElement('div'); linked.id = 'dueLinked'; linked.className = 'hidden';
  var remain = document.createElement('div'); remain.id = 'dueRemainHint'; remain.className = 'muted hidden';
  wrap.appendChild(lab); wrap.appendChild(search); wrap.appendChild(results); wrap.appendChild(linked); wrap.appendChild(remain);
  box.insertBefore(wrap, box.firstChild);
  search.oninput = function () { renderDueResults(search.value); };
  var existingRef = $('f_dueRef').value;
  if (existingRef) {
    showLinkedBanner($('f_party').value, $('f_room') ? $('f_room').value : '');
  } else {
    renderDueResults('');
  }
}

function renderDueResults(q) {
  var results = $('dueResults'); if (!results) return;
  var list = (DASH.dues && DASH.dues.openDues) || [];
  q = (q || '').trim().toLowerCase();
  var filtered = q ? list.filter(function (d) {
    return (d.party || '').toLowerCase().indexOf(q) !== -1 || (d.room || '').toLowerCase().indexOf(q) !== -1;
  }) : list;
  filtered = filtered.slice(0, 20); // keep the tappable list short on a phone
  if (!filtered.length) {
    results.innerHTML = '<p class="muted" style="margin:4px 0">' + (list.length ? 'No matches.' : 'No open dues.') + '</p>';
    return;
  }
  results.innerHTML = '';
  filtered.forEach(function (d) {
    var row = document.createElement('div'); row.className = 'party';
    row.innerHTML = '<div class="top"><span class="nm">' + escapeHtml(d.party) +
      (d.room ? (' · ' + escapeHtml(d.room)) : '') +
      (dueSectionTag(d.section) ? ' <span class="muted" style="font-size:11px">[' + dueSectionTag(d.section) + ']</span>' : '') +
      '</span><span class="ob">Rs ' + fmt(d.outstanding) + '</span></div>' +
      '<div class="muted" style="font-size:12px">' + dLabel(d) + '</div>';
    row.onclick = function () { pickDue(d); };
    results.appendChild(row);
  });
}

function pickDue(d) {
  $('f_dueRef').value = d.dueId;
  $('f_party').value = d.party;
  var roomSel = $('f_room');
  if (roomSel) {
    for (var i = 0; i < roomSel.options.length; i++) {
      if (roomSel.options[i].value === d.room) { roomSel.value = d.room; break; }
    }
  }
  if (!$('f_amount').value) $('f_amount').value = d.outstanding;
  $('dueSearch').value = '';
  showLinkedBanner(d.party, d.room, d.outstanding);
  updateDueRemainHint();
}

// Live "how much will still be owed after this recovery" feedback — the
// picker auto-fills the full outstanding on pick (above), so this is what
// makes editing that number down to a partial payment visible/trustworthy
// instead of a silent, unconfirmed edit.
function updateDueRemainHint() {
  var hint = $('dueRemainHint'); if (!hint) return;
  var ref = $('f_dueRef') ? $('f_dueRef').value : '';
  if (!ref) { hint.classList.add('hidden'); return; }
  var list = (DASH.dues && DASH.dues.openDues) || [];
  var d = null;
  for (var i = 0; i < list.length; i++) { if (list[i].dueId === ref) { d = list[i]; break; } }
  if (!d) { hint.classList.add('hidden'); return; }
  var amt = Number($('f_amount').value) || 0;
  var remaining = d.outstanding - amt;
  hint.classList.remove('hidden');
  if (remaining < -0.01) {
    hint.style.color = 'var(--danger)';
    hint.textContent = 'Exceeds outstanding by Rs ' + fmt(-remaining) + ' — max Rs ' + fmt(d.outstanding);
  } else {
    hint.style.color = '';
    hint.textContent = 'Remaining due after this: Rs ' + fmt(remaining);
  }
}

function showLinkedBanner(party, room, outstanding) {
  var linked = $('dueLinked');
  linked.classList.remove('hidden');
  linked.innerHTML = 'Linked to ' + escapeHtml(party || '(unnamed)') + (room ? (' · ' + escapeHtml(room)) : '') +
    (outstanding !== undefined ? (' · outstanding Rs ' + fmt(outstanding)) : '') +
    ' — <a href="#" id="unlinkDue">change</a>';
  $('unlinkDue').onclick = function (e) { e.preventDefault(); clearDueLink(); };
  var results = $('dueResults'); if (results) results.innerHTML = '';
}

function clearDueLink() {
  $('f_dueRef').value = '';
  var linked = $('dueLinked');
  linked.classList.add('hidden'); linked.innerHTML = '';
  renderDueResults('');
  updateDueRemainHint();
}

function updateSaveLabel() {
  $('saveBtn').textContent = STATE.editingId ? 'Update entry' : 'Save entry';
  var hint = $('editHint');
  if (STATE.editingId) { hint.textContent = 'Editing an existing entry. Change fields and Update, or tap a section to cancel.'; hint.classList.remove('hidden'); }
  else hint.classList.add('hidden');
}

function collectPayload() {
  var dateStr = $('entryDate').value;
  if (!dateStr) { toast('Pick a date.', true); return null; }
  var parts = dateStr.split('-');
  var fields = {};
  var defs = visibleFieldDefs(STATE.section);
  for (var i = 0; i < defs.length; i++) {
    var d = defs[i];
    var v = $('f_' + d.key).value;
    if (d.type === 'select' && d.src === 'rooms' && v === '__other__') {
      v = ($('f_' + d.key + '_other').value || '').trim();
      if (!v) { toast('Type the room in "' + d.label + '".', true); return null; }
    }
    if (d.req && (v === '' || v === null)) { toast(d.label + ' is required.', true); return null; }
    fields[d.key] = v;
  }
  if (!(Number(fields.amount) > 0)) { toast('Amount must be greater than 0.', true); return null; }
  if (STATE.section === 'expense' && fields.category === 'General & Misc' && !String(fields.remark || '').trim()) {
    toast('Add a Remark describing the expense — "General & Misc" needs a reason so it isn\'t untraceable later.', true);
    return null;
  }
  return {
    hotel: STATE.hotel, pin: STATE.pin, section: STATE.section, enteredBy: STATE.staffName,
    date: { year: Number(parts[0]), month: Number(parts[1]), day: Number(parts[2]) },
    fields: fields
  };
}

$('saveBtn').onclick = function () {
  var payload = collectPayload();
  if (!payload) return;
  $('saveBtn').disabled = true;
  var editing = STATE.editingId;
  if (editing) { payload.entryId = editing; payload.origYm = STATE.editOrigYm; }
  var savedYm = payload.date.year + '-' + (payload.date.month < 10 ? '0' : '') + payload.date.month;
  var runner = google.script.run
    .withSuccessHandler(function () {
      $('saveBtn').disabled = false;
      toast(editing ? 'Updated.' : 'Saved.');
      STATE.editingId = null;
      buildFields();       // clear entered values for the next row
      updateSaveLabel();
      // Jump the list to the saved-into month — for a new entry, or an edit
      // whose date crossed a month boundary (the row moved tabs server-side).
      if (!editing || savedYm !== STATE.editOrigYm) ensureListMonth(savedYm);
      loadEntries();
      loadDues(); // a due/recovery may have changed the tracker + datalist
      if (!$('dashView').classList.contains('hidden')) loadDailyReport();
    })
    .withFailureHandler(function (err) {
      $('saveBtn').disabled = false;
      toast(err && err.message ? err.message : String(err), true);
      if (STATE.section === 'recovery') loadDues(); // due may have moved (guard rejection) — refresh the picker
    });
  if (editing) runner.updateEntry(payload); else runner.submitEntry(payload);
};

function currentYm() {
  var v = $('entryDate').value; if (!v) return null;
  var p = v.split('-'); return p[0] + '-' + p[1];
}

// The "View month" selector drives the listing, decoupled from the new-entry
// date field so staff can review/edit/delete past months without changing the date.
function ymOptionLabel(y, m) {
  return new Date(y, m - 1, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });
}
function buildMonthList() {
  var sel = $('listMonth'); sel.innerHTML = '';
  var now = new Date();
  for (var i = 0; i < 12; i++) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    var mm = d.getMonth() + 1;
    var opt = document.createElement('option');
    opt.value = d.getFullYear() + '-' + (mm < 10 ? '0' : '') + mm;
    opt.textContent = ymOptionLabel(d.getFullYear(), mm);
    sel.appendChild(opt);
  }
  sel.value = todayIso().slice(0, 7); // default to the current month
}
function listYm() { return $('listMonth').value || currentYm(); }
function ensureListMonth(ym) {
  var sel = $('listMonth');
  for (var i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === ym) { sel.value = ym; return; }
  }
  var pr = ym.split('-');
  var opt = document.createElement('option');
  opt.value = ym; opt.textContent = ymOptionLabel(Number(pr[0]), Number(pr[1]));
  sel.appendChild(opt); sel.value = ym;
}

$('refreshBtn').onclick = loadEntries;
$('listMonth').onchange = loadEntries;

function loadEntries() {
  var ym = listYm(); if (!ym) return;
  $('entries').innerHTML = '<p class="muted">Loading...</p>';
  google.script.run
    .withSuccessHandler(renderEntries)
    .withFailureHandler(function (err) {
      $('entries').innerHTML = '<p class="muted">' + (err && err.message ? err.message : 'Could not load') + '</p>';
    })
    .listEntries(STATE.hotel, STATE.pin, ym);
}

function renderEntries(list) {
  var box = $('entries');
  if (!list || !list.length) { box.innerHTML = '<p class="muted">No app entries for this month yet.</p>'; return; }
  box.innerHTML = '';
  list.forEach(function (e) {
    var row = document.createElement('div'); row.className = 'entry';
    var day = document.createElement('span'); day.className = 'day'; day.textContent = e.day ? (e.day + '') : '?';
    var grow = document.createElement('div'); grow.className = 'grow';
    var enteredBy = (e.fields && e.fields.enteredBy) || '';
    grow.innerHTML = '<span class="sec">' + e.section + '</span><br>' + escapeHtml(e.label || '') +
      (enteredBy ? ' <span class="muted">· ' + escapeHtml(enteredBy) + '</span>' : '');
    var amt = document.createElement('span'); amt.className = 'amt'; amt.textContent = 'Rs ' + fmt(e.amount);
    var ed = document.createElement('button'); ed.className = 'mini ed'; ed.textContent = 'Edit';
    ed.onclick = function () { startEdit(e); };
    var del = document.createElement('button'); del.className = 'mini del'; del.textContent = 'Delete';
    del.onclick = function () { doDelete(e); };
    row.appendChild(day); row.appendChild(grow); row.appendChild(amt); row.appendChild(ed); row.appendChild(del);
    box.appendChild(row);
  });
}

function startEdit(e) {
  STATE.section = e.section;
  STATE.editingId = e.entryId;
  STATE.editOrigYm = listYm(); // the tab this row currently lives in — updateEntry needs it to find the row even if the date field is then edited across a month boundary
  buildSectionChips();
  buildFields(e.fields || {});
  updateSaveLabel();
  if (e.day) {
    var ym = listYm().split('-');
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    $('entryDate').value = ym[0] + '-' + ym[1] + '-' + p(e.day);
  }
  window.scrollTo(0, 0);
}

function doDelete(e) {
  if (!window.confirm('Delete this ' + e.section + ' entry (day ' + (e.day || '?') + ', Rs ' + fmt(e.amount) + ')?')) return;
  google.script.run
    .withSuccessHandler(function () { toast('Deleted.'); loadEntries(); })
    .withFailureHandler(function (err) { toast(err && err.message ? err.message : String(err), true); })
    .deleteEntry(STATE.hotel, STATE.pin, listYm(), e.entryId);
}

$('lockBtn').onclick = function () {
  STATE = { hotel: null, pin: null, config: null, staffName: null, section: 'rent', editingId: null, editOrigYm: null };
  DASH = { scope: 'lifetime', dues: null, repLoaded: false };

  $('pinScreen').classList.remove('hidden');

function showView(which) {

  $('invView').classList.toggle('hidden', which !== 'inv');
  $('dashView').classList.toggle('hidden', which !== 'dash');

$('navInv').onclick = function () { showView('inv'); };

// ---- dashboard state ----
var DASH = { scope: 'lifetime', dues: null, repLoaded: false };

function errText(err) { return err && err.message ? err.message : String(err); }

function openDashboard() {
  if (!DASH.repLoaded) { buildRepMonths(); buildScopeChips(); DASH.repLoaded = true; }
  loadDailyReport();

// ---- daily report ----
function buildRepMonths() {
  var sel = $('repMonth'); sel.innerHTML = '';
  var now = new Date();
  for (var i = 0; i < 12; i++) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    var mm = d.getMonth() + 1;
    var opt = document.createElement('option');
    opt.value = d.getFullYear() + '-' + (mm < 10 ? '0' : '') + mm;
    opt.textContent = ymOptionLabel(d.getFullYear(), mm);
    sel.appendChild(opt);
  }
  sel.value = todayIso().slice(0, 7);

$('repMonth').onchange = loadDailyReport;

function loadDailyReport() {
  var ym = $('repMonth').value; if (!ym) return;
  $('repTable').innerHTML = '<p class="muted">Loading...</p>';
  google.script.run
    .withSuccessHandler(renderDailyReport)
    .withFailureHandler(function (err) { $('repTable').innerHTML = '<p class="muted">' + errText(err) + '</p>'; })
    .getDailyReport(STATE.hotel, STATE.pin, ym);
}

function renderDailyReport(rep) {
  if (!rep || !rep.days || !rep.days.length) {
    $('repTable').innerHTML = '<p class="muted">No entries for this month yet.</p>'; return;
  }
  var todayD = (todayIso().slice(0, 7) === rep.ym) ? Number(todayIso().slice(8)) : -1;
  var h = '<div class="tablewrap"><table class="rep"><thead><tr>' +
    '<th>Day</th><th>Rent</th><th>Food</th><th>Exp</th><th>Rec.Cash</th><th>Rec.Bank</th><th>Net</th></tr></thead><tbody>';
  rep.days.forEach(function (d) {
    h += '<tr class="' + (d.day === todayD ? 'today' : '') + '"><td>' + d.day + '</td><td>' +
      fmt(d.rent) + '</td><td>' + fmt(d.food) + '</td><td>' + fmt(d.expense) + '</td><td>' +
      fmt(d.recoveryCash) + '</td><td>' + fmt(d.recoveryBank) + '</td><td>' + fmt(d.net) + '</td></tr>';
  });
  var t = rep.totals;
  h += '<tr class="tot"><td>Total</td><td>' + fmt(t.rent) + '</td><td>' + fmt(t.food) + '</td><td>' +
    fmt(t.expense) + '</td><td>' + fmt(t.recoveryCash) + '</td><td>' + fmt(t.recoveryBank) + '</td><td>' + fmt(t.net) + '</td></tr></tbody></table></div>';
  $('repTable').innerHTML = h;
}

// ---- month export (xlsx, for the CA) ----
$('exportBtn').onclick = function () {
  var ym = $('repMonth').value; if (!ym) return;
  var btn = $('exportBtn');
  btn.disabled = true;
  $('exportStatus').textContent = 'Preparing file...';
  google.script.run
    .withSuccessHandler(function (res) {
      var bytes = atob(res.base64);
      var arr = new Uint8Array(bytes.length);
      for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      var blob = new Blob([arr], { type: res.mimeType });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = res.filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      btn.disabled = false;
      $('exportStatus').textContent = '';
    })
    .withFailureHandler(function (err) {
      btn.disabled = false;
      $('exportStatus').textContent = errText(err);
    })
    .exportMonthWorkbook(STATE.hotel, STATE.pin, ym);
};

// ---- due tracker ----
function buildScopeChips() {
  var box = $('scopeChips'); box.innerHTML = '';
  [['month', 'This month'], ['year', 'This year'], ['lifetime', 'Lifetime']].forEach(function (pair) {
    var b = document.createElement('div');
    b.className = 'chip' + (pair[0] === DASH.scope ? ' on' : '');
    b.textContent = pair[1];
    b.onclick = function () { DASH.scope = pair[0]; buildScopeChips(); renderDues(); };
    box.appendChild(b);
  });
}

function loadDues() {
  google.script.run
    .withSuccessHandler(function (d) { DASH.dues = d; fillPartiesDatalist(d); renderDues(); })
    .withFailureHandler(function (err) { $('partyList').innerHTML = '<p class="muted">' + errText(err) + '</p>'; })
    .getDuesTracker(STATE.hotel, STATE.pin);
}

function fillPartiesDatalist(d) {
  var dl = $('partiesDatalist'); dl.innerHTML = '';
  (d.outstandingParties || []).forEach(function (nm) {
    var o = document.createElement('option'); o.value = nm; dl.appendChild(o);
  });
}

function dLabel(ln) {
  var mm = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][(ln.month || 1) - 1];
  return (ln.day || '?') + ' ' + mm + ' ' + String(ln.year).slice(-2);
}

// A due can originate from a rent (room) or food row — tag it so staff can
// tell apart two dues for the same guest (e.g. an unpaid room + an unpaid
// meal tab).
function dueSectionTag(section) {
  return section === 'food' ? 'Food' : section === 'rent' ? 'Room' : '';
}

function renderDues() {
  var d = DASH.dues; if (!d) return;
  var sc = d.scopes[DASH.scope] || { incurred: 0, recovered: 0, outstanding: 0 };
  $('dueTiles').innerHTML =
    '<div class="tiles">' +
    '<div class="tile"><div class="k">Incurred</div><div class="v">' + fmt(sc.incurred) + '</div></div>' +
    '<div class="tile"><div class="k">Recovered</div><div class="v">' + fmt(sc.recovered) + '</div></div>' +
    '<div class="tile out"><div class="k">' + (DASH.scope === 'lifetime' ? 'Outstanding' : 'Net') +
    '</div><div class="v">' + fmt(sc.outstanding) + '</div></div></div>';
  var parties = d.parties || [];
  var box = $('partyList');
  if (!parties.length) { box.innerHTML = '<p class="muted">No dues recorded yet.</p>'; return; }
  box.innerHTML = '<div class="muted" style="margin-top:6px">Balances owed (lifetime, per party) — tap to see lines</div>';
  parties.forEach(function (p) {
    var row = document.createElement('div'); row.className = 'party';
    var cleared = p.outstanding <= 0;
    var lines = p.lines.map(function (ln) {
      return '<div class="ln ' + (ln.type === 'recovery' ? 'rec' : '') + '"><span>' +
        dLabel(ln) + ' · ' + (ln.type === 'recovery' ? 'recovered' : 'due') +
        (ln.room ? (' · ' + escapeHtml(ln.room)) : '') +
        (dueSectionTag(ln.section) ? (' · ' + dueSectionTag(ln.section)) : '') +
        (ln.orphaned ? ' · <span style="color:var(--danger)">⚠ unlinked</span>' : '') +
        '</span><span>' +
        (ln.type === 'recovery' ? '−' : '+') + fmt(ln.amount) + '</span></div>';
    }).join('');
    row.innerHTML = '<div class="top"><span class="nm">' + escapeHtml(p.party) + '</span>' +
      '<span class="ob' + (cleared ? ' clear' : '') + '">' + fmt(p.outstanding) + '</span></div>' +
      '<div class="lines hidden">' + lines + '</div>';
    row.onclick = function () { row.querySelector('.lines').classList.toggle('hidden'); };
    box.appendChild(row);
  });
}

function fmt(n) { n = Number(n) || 0; return n.toLocaleString('en-IN'); }
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

// ---- inventory: purchase / usage / recount ----

function loadInventoryConfig() {
  google.script.run
    .withSuccessHandler(function (cfg) {
      INV_CONFIG = cfg;
      // Wrapped: an exception anywhere in here used to silently stop this
      // callback partway through, leaving the item dropdown/stock list empty
      // with zero indication anything went wrong. Now it's a visible toast.
      try {
        buildInvTypeChips();
        buildInvFields();
        renderStockList();
      } catch (e) {
        toast('Inventory UI error: ' + (e && e.message ? e.message : e), true);
      }
      loadInventoryLog();
      $('closeDate').value = todayIso();
      loadClosingStockStatus();
    })
    .withFailureHandler(function (err) { toast(errText(err), true); })
    .getInventoryConfig(STATE.hotel, STATE.pin);
}

function buildInvTypeChips() {
  var box = $('invTypeChips'); box.innerHTML = '';
  var types = (INV_CONFIG && INV_CONFIG.types) || ['Purchase', 'Usage', 'Recount'];
  types.forEach(function (t) {
    var b = document.createElement('div');
    b.className = 'chip' + (t === INV.type ? ' on' : '');
    b.textContent = t;
    b.onclick = function () { INV.type = t; buildInvTypeChips(); buildInvFields(); };
    box.appendChild(b);
  });
}

function findStockItem(name) {
  var list = (INV_CONFIG && INV_CONFIG.stock) || [];
  for (var i = 0; i < list.length; i++) { if (list[i].item === name) return list[i]; }
  return null;
}

function buildInvFields() {
  var box = $('invFields'); box.innerHTML = '';

  var qtyLabel = INV.type === 'Recount' ? 'Counted quantity (total on hand)' : 'Quantity';
  var qlab = document.createElement('label'); qlab.textContent = qtyLabel + ' *';
  box.appendChild(qlab);
  var qty = document.createElement('input');
  qty.type = 'number'; qty.id = 'f_inv_qty'; qty.inputMode = 'decimal'; qty.min = '0';
  box.appendChild(qty);

  if (INV.type === 'Recount') {
    var hint = document.createElement('p'); hint.id = 'recountHint'; hint.className = 'muted hidden';
    box.appendChild(hint);
    qty.oninput = updateRecountHint;
  }

  if (INV.type === 'Usage') {
    var rlab = document.createElement('label'); rlab.textContent = 'Reason *';
    box.appendChild(rlab);
    var rsel = document.createElement('select'); rsel.id = 'f_inv_reason';
    (INV_CONFIG && INV_CONFIG.reasons || ['Used', 'Damaged', 'Lost', 'Given away', 'Other']).forEach(function (r) {
      var o = document.createElement('option'); o.value = r; o.textContent = r; rsel.appendChild(o);
    });
    box.appendChild(rsel);
  }

  var remLabel = 'Remark' + (INV.type === 'Usage' ? ' (required if reason is Other)' : ' (optional)');
  var remlab = document.createElement('label'); remlab.textContent = remLabel;

  var rem = document.createElement('input'); rem.type = 'text'; rem.id = 'f_inv_remark';
  box.appendChild(rem);

  buildItemSelect(); // prepended to the top of #invFields
}

// Plain native <select> grouped by category — staff use Android, where a
// native select renders as a normal scrollable list (no iOS wheel-scroll
// penalty), and matches the Room/Category dropdowns used everywhere else in
// this app. Replaces an earlier search-box-then-tap picker that staff
// reported they couldn't find/use — its renderItemResults only showed the
// first 25 items until you typed a matching search term, so most of the
// catalog was effectively invisible.
//
// A search box sits above the select and only NARROWS its options (empty box
// = full list, same as before). It deliberately does not replace the select —
// see the failed search-only picker above.
function buildItemSelect() {
  var box = $('invFields');
  var lab = document.createElement('label'); lab.textContent = 'Item *';
  var search = document.createElement('input');
  search.type = 'search'; search.id = 'f_inv_search';
  search.placeholder = 'Search item or category…';
  search.setAttribute('autocomplete', 'off');
  // Native selects can't be popped open from script on Android, so typing
  // alone looked like "search does nothing". Matches show live as a tappable
  // list right under the box; the select below stays as a filtered backup.
  var results = document.createElement('div'); results.id = 'invResults';
  var sel = document.createElement('select'); sel.id = 'f_inv_item';
  sel.onchange = function () {
    results.innerHTML = '';
    if (INV.type === 'Recount') updateRecountHint();
  };
  search.oninput = function () { fillItemOptions(sel, this.value); renderItemMatches(this.value); };
  fillItemOptions(sel, '');
  box.insertBefore(sel, box.firstChild);
  box.insertBefore(results, sel);
  box.insertBefore(search, results);
  box.insertBefore(lab, search);
}

// Active (non-retired, non-orphaned) stock in dropdown order: category order
// from INV_CONFIG.categories, then sheet order within a category. Shared by
// the dropdown and the tap-list so they never disagree.
function activeInvStock() {
  var all = ((INV_CONFIG && INV_CONFIG.stock) || []).filter(function (s) { return !s.orphaned && !s.retired; });
  var out = [];
  ((INV_CONFIG && INV_CONFIG.categories) || []).forEach(function (cat) {
    all.forEach(function (s) { if (s.category === cat) out.push(s); });
  });
  return out;
}

function renderItemMatches(query) {
  var results = $('invResults'); if (!results) return;
  var q = String(query || '').trim().toLowerCase();
  results.innerHTML = '';
  if (!q) return;
  var matches = activeInvStock().filter(function (s) { return matchesItemQuery(s, q); });
  if (!matches.length) {
    results.innerHTML = '<p class="muted" style="margin:4px 0">No items match.</p>';
    return;
  }
  matches.forEach(function (s) {
    var row = document.createElement('div'); row.className = 'party';
    row.innerHTML = '<div class="top"><span class="nm">' + escapeHtml(s.item) +
      ' <span class="muted" style="font-size:12px">· ' + escapeHtml(s.category || '') + '</span></span>' +
      '<span class="ob"' + (s.low ? ' style="color:var(--danger)"' : '') + '>stock ' + escapeHtml(String(s.currentStock)) +
      (s.low ? ' LOW' : '') + '</span></div>';
    row.onclick = function () { pickInvItem(s); };
    results.appendChild(row);
  });
}

function pickInvItem(s) {
  var search = $('f_inv_search'), sel = $('f_inv_item');
  search.value = s.item;
  fillItemOptions(sel, s.item);
  sel.value = s.item;
  $('invResults').innerHTML = '';
  if (INV.type === 'Recount') updateRecountHint();
  if ($('f_inv_qty')) $('f_inv_qty').focus();
}

// Case-insensitive substring match on item name or category name.
function matchesItemQuery(s, q) {
  if (!q) return true;
  return String(s.item || '').toLowerCase().indexOf(q) !== -1 ||
    String(s.category || '').toLowerCase().indexOf(q) !== -1;
}

// (Re)builds the item select's options filtered by `query`. Keeps the current
// selection if it still matches; never auto-selects a single match (owner
// wants staff to always tap the item explicitly).
function fillItemOptions(sel, query) {
  var q = String(query || '').trim().toLowerCase();
  var prev = sel.value;
  while (sel.firstChild) sel.removeChild(sel.firstChild);
  var blank = document.createElement('option');
  blank.value = ''; blank.disabled = true; blank.textContent = 'Select an item…';
  sel.appendChild(blank);
  // Built from INV_CONFIG.stock (not the separate .items field) — stock
  // already carries {item, category, currentStock, low} for every catalog
  // entry, so this is one data source instead of two, and orphaned (retired)
  // entries are naturally excluded since they're not valid Purchase/Usage
  // targets anyway.
  var all = activeInvStock();
  var stock = all.filter(function (s) { return matchesItemQuery(s, q); });
  var categories = (INV_CONFIG && INV_CONFIG.categories) || [];
  var count = 0, kept = false;
  categories.forEach(function (cat) {
    var inCat = stock.filter(function (s) { return s.category === cat; });
    if (!inCat.length) return;
    var grp = document.createElement('optgroup'); grp.label = cat;
    inCat.forEach(function (s) {
      var o = document.createElement('option');
      o.value = s.item;
      o.textContent = s.item + ' — stock: ' + s.currentStock + (s.low ? ' (LOW)' : '');
      if (prev && s.item === prev) { o.selected = true; kept = true; }
      grp.appendChild(o);
      count++;
    });
    sel.appendChild(grp);
  });
  if (!kept) blank.selected = true;
  if (!count) {
    var warn = document.createElement('option');
    warn.value = ''; warn.disabled = true;
    warn.textContent = all.length ? 'No items match "' + q + '"' : 'No items loaded — try reloading the page';
    sel.appendChild(warn);
  }
  if (prev && !kept && INV.type === 'Recount') updateRecountHint();
}

// Live "system shows N — this will log a delta of ±M" feedback, mirrors
// updateDueRemainHint's live-diff pattern.
function updateRecountHint() {
  var hint = $('recountHint'); if (!hint) return;
  var itemName = $('f_inv_item') ? $('f_inv_item').value : '';
  var it = itemName ? findStockItem(itemName) : null;
  var counted = Number($('f_inv_qty').value);
  if (!it || $('f_inv_qty').value === '' || isNaN(counted)) { hint.classList.add('hidden'); return; }
  var delta = counted - it.currentStock;
  hint.classList.remove('hidden');
  hint.textContent = 'System shows ' + it.currentStock + ' — this will log a delta of ' +
    (delta >= 0 ? '+' : '') + delta + '.';
}

$('invSaveBtn').onclick = function () {
  var itemName = $('f_inv_item').value;
  if (!itemName) { toast('Pick an item.', true); return; }
  var dateStr = $('invDate').value;
  if (!dateStr) { toast('Pick a date.', true); return; }
  var qtyVal = Number($('f_inv_qty').value);
  if ($('f_inv_qty').value === '' || isNaN(qtyVal) || qtyVal < 0) { toast('Enter a quantity.', true); return; }
  if (INV.type !== 'Recount' && !(qtyVal > 0)) { toast('Quantity must be greater than 0.', true); return; }
  var reason = INV.type === 'Usage' ? ($('f_inv_reason') ? $('f_inv_reason').value : '') : '';
  var remark = ($('f_inv_remark') && $('f_inv_remark').value || '').trim();
  if (INV.type === 'Usage' && reason === 'Other' && !remark) {
    toast('Add a Remark describing the usage — "Other" needs a reason so it isn\'t untraceable later.', true);
    return;
  }
  var parts = dateStr.split('-');
  var payload = {
    hotel: STATE.hotel, pin: STATE.pin, item: itemName, type: INV.type,
    qty: qtyVal, reason: reason, remark: remark, enteredBy: STATE.staffName,
    date: { year: Number(parts[0]), month: Number(parts[1]), day: Number(parts[2]) }
  };
  $('invSaveBtn').disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      $('invSaveBtn').disabled = false;
      toast('Saved — new stock: ' + res.resultingStock + '.');
      buildInvFields(); // clear item/qty/reason/remark for the next transaction
      refreshInventoryStock();
      loadInventoryLog();
    })
    .withFailureHandler(function (err) {
      $('invSaveBtn').disabled = false;
      toast(errText(err), true);
    })
    .submitInventoryTxn(payload);
};

function refreshInventoryStock() {
  google.script.run
    .withSuccessHandler(function (stock) { if (INV_CONFIG) INV_CONFIG.stock = stock; renderStockList(); })
    .withFailureHandler(function (err) { toast(errText(err), true); })
    .getInventoryStock(STATE.hotel, STATE.pin);
}

$('invStockSearch').oninput = function () { INV.stockSearch = this.value; renderStockList(); };

function renderStockList() {
  var box = $('invStockList');
  var list = (INV_CONFIG && INV_CONFIG.stock) || [];
  var q = (INV.stockSearch || '').trim().toLowerCase();
  var filtered = q ? list.filter(function (it) { return it.item.toLowerCase().indexOf(q) !== -1; }) : list;
  var active = filtered.filter(function (it) { return !it.retired; });
  var retired = filtered.filter(function (it) { return it.retired; });
  if (!active.length && !retired.length) { box.innerHTML = '<p class="muted">No items.</p>'; return; }
  var byCat = {};
  active.forEach(function (it) { (byCat[it.category] = byCat[it.category] || []).push(it); });
  var html = '';
  var rowHtml = function (it) {
    return '<div class="entry' + (it.low && !it.retired ? ' low' : '') + '" data-item="' + escapeHtml(it.item) +
      '" style="cursor:pointer"><span class="grow">' + escapeHtml(it.item) +
      (it.custom ? ' <span class="muted">(added)</span>' : '') +
      (it.orphaned ? ' <span class="muted">(not in catalog)</span>' : '') +
      '</span><span class="amt">' + it.currentStock + ' <span class="muted">/ min ' + it.minStock + '</span></span></div>';
  };
  Object.keys(byCat).sort().forEach(function (cat) {
    var items = byCat[cat].slice().sort(function (a, b) {
      if (a.low !== b.low) return a.low ? -1 : 1; // low items first within each category
      return a.item < b.item ? -1 : (a.item > b.item ? 1 : 0);
    });
    html += '<div class="muted" style="margin-top:10px;font-weight:600">' + escapeHtml(cat) + '</div>';
    items.forEach(function (it) { html += rowHtml(it); });
  });
  if (retired.length) {
    html += '<details style="margin-top:14px"' + (q ? ' open' : '') + '><summary class="muted" style="font-weight:600">Retired (' +
      retired.length + ')</summary>' + retired.map(rowHtml).join('') + '</details>';
  }
  box.innerHTML = html;
  Array.prototype.forEach.call(box.querySelectorAll('.entry[data-item]'), function (el) {
    el.onclick = function () { openItemPanel(el.getAttribute('data-item')); };
  });
}

// ---- add / manage items ----

function buildAddCategorySelect() {
  var sel = $('f_new_cat'); sel.innerHTML = '';
  ((INV_CONFIG && INV_CONFIG.categories) || []).forEach(function (c) {
    var o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o);
  });
  var other = document.createElement('option'); other.value = '__new__'; other.textContent = 'New category…';
  sel.appendChild(other);
  $('f_new_cat_other').classList.add('hidden');
}
$('f_new_cat').onchange = function () {
  $('f_new_cat_other').classList.toggle('hidden', this.value !== '__new__');
};
$('invAddBtn').onclick = function () {
  $('invItemPanel').classList.add('hidden');
  var f = $('invAddForm');
  var show = f.classList.contains('hidden');
  f.classList.toggle('hidden', !show);
  if (show) {
    buildAddCategorySelect();
    $('f_new_name').value = ''; $('f_new_open').value = ''; $('f_new_min').value = '2';
    $('f_new_cat_other').value = '';
    $('f_new_name').focus();
  }
};
$('invAddCancel').onclick = function () { $('invAddForm').classList.add('hidden'); };
$('invAddSave').onclick = function () {
  var name = $('f_new_name').value.trim();
  if (!name) { toast('Enter an item name.', true); return; }
  var cat = $('f_new_cat').value === '__new__' ? $('f_new_cat_other').value.trim() : $('f_new_cat').value;
  if (!cat) { toast('Pick or enter a category.', true); return; }
  var btn = $('invAddSave'); btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false;
      toast('Added "' + res.item + '".');
      $('invAddForm').classList.add('hidden');
      reloadInventoryConfigQuiet();
      loadInventoryLog();
    })
    .withFailureHandler(function (err) { btn.disabled = false; toast(errText(err), true); })
    .addInventoryItem({
      hotel: STATE.hotel, pin: STATE.pin, name: name, category: cat,
      openingStock: $('f_new_open').value, minStock: $('f_new_min').value, enteredBy: STATE.staffName
    });
};

// Refetch stock + categories (a new category must reach the picker and the
// add form), then rebuild everything that reads them.
function reloadInventoryConfigQuiet() {
  google.script.run
    .withSuccessHandler(function (cfg) {
      INV_CONFIG = cfg;
      try { buildInvFields(); renderStockList(); } catch (e) { toast('Inventory UI error: ' + e.message, true); }
    })
    .withFailureHandler(function (err) { toast(errText(err), true); })
    .getInventoryConfig(STATE.hotel, STATE.pin);
}

function openItemPanel(name) {
  var it = findStockItem(name); if (!it) return;
  $('invAddForm').classList.add('hidden');
  var p = $('invItemPanel'); p.classList.remove('hidden');
  var canRetire = it.currentStock === 0;
  p.innerHTML = '<div style="font-weight:600;margin-bottom:6px">' + escapeHtml(it.item) + ' <span class="muted">· ' +
    escapeHtml(it.category) + ' · stock ' + it.currentStock + '</span></div>' +
    '<label>Rename</label><input id="ip_name" type="text" maxlength="60" value="' + escapeHtml(it.item) + '">' +
    '<button class="mini ed" id="ip_rename" style="margin-top:6px">Save name</button>' +
    '<label>Min stock</label><input id="ip_min" type="number" inputmode="decimal" min="0" value="' + it.minStock + '">' +
    '<button class="mini ed" id="ip_minsave" style="margin-top:6px">Save min stock</button>' +
    '<div style="height:10px"></div>' +
    (it.retired
      ? '<button class="mini ed" id="ip_toggle">Unretire</button>'
      : '<button class="mini del" id="ip_toggle"' + (canRetire ? '' : ' disabled') + '>Retire item</button>' +
        (canRetire ? '' : '<p class="muted">Stock must be 0 to retire (record usage or a recount first).</p>')) +
    ' <button class="mini ed" id="ip_close">Close</button>';
  var send = function (action, extra, okMsg) {
    var payload = { hotel: STATE.hotel, pin: STATE.pin, item: it.item, action: action };
    for (var k in extra) payload[k] = extra[k];
    google.script.run
      .withSuccessHandler(function () {
        toast(okMsg); p.classList.add('hidden');
        reloadInventoryConfigQuiet(); loadInventoryLog();
      })
      .withFailureHandler(function (err) { toast(errText(err), true); })
      .updateInventoryItem(payload);
  };
  $('ip_rename').onclick = function () { send('rename', { newName: $('ip_name').value }, 'Renamed.'); };
  $('ip_minsave').onclick = function () { send('minStock', { minStock: $('ip_min').value }, 'Min stock saved.'); };
  $('ip_toggle').onclick = function () {
    if (it.retired) send('unretire', {}, 'Item restored.');
    else send('retire', {}, 'Item retired.');
  };
  $('ip_close').onclick = function () { p.classList.add('hidden'); };
  p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function loadInventoryLog() {
  google.script.run
    .withSuccessHandler(renderInvLog)
    .withFailureHandler(function (err) { $('invLog').innerHTML = '<p class="muted">' + errText(err) + '</p>'; })
    .listInventoryLog(STATE.hotel, STATE.pin);
}

function renderInvLog(list) {
  var box = $('invLog');
  if (!list || !list.length) { box.innerHTML = '<p class="muted">No transactions yet.</p>'; return; }
  box.innerHTML = '';
  // Cap rendered rows for phone usability — the log itself is unbounded.
  list.slice(0, 100).forEach(function (e) {
    var row = document.createElement('div'); row.className = 'entry';
    var grow = document.createElement('div'); grow.className = 'grow';
    grow.innerHTML = '<span class="sec">' + e.type + '</span><br>' + escapeHtml(e.item) +
      (e.reason ? ' · ' + escapeHtml(e.reason) : '') +
      (e.remark ? ' <span class="muted">· ' + escapeHtml(e.remark) + '</span>' : '') +
      ' <span class="muted">· ' + escapeHtml(e.date) + (e.enteredBy ? ' · ' + escapeHtml(e.enteredBy) : '') + '</span>';
    var amt = document.createElement('span'); amt.className = 'amt';
    amt.textContent = (e.qty >= 0 ? '+' : '') + e.qty;
    var del = document.createElement('button'); del.className = 'mini del'; del.textContent = 'Delete';
    del.onclick = function () { doDeleteInv(e); };
    row.appendChild(grow); row.appendChild(amt); row.appendChild(del);
    box.appendChild(row);
  });
}

function doDeleteInv(e) {
  if (!window.confirm('Delete this ' + e.type + ' on ' + e.item + ' (' + (e.qty >= 0 ? '+' : '') + e.qty + ')?')) return;
  google.script.run
    .withSuccessHandler(function () { toast('Deleted.'); refreshInventoryStock(); loadInventoryLog(); })
    .withFailureHandler(function (err) { toast(errText(err), true); })
    .deleteInventoryTxn(STATE.hotel, STATE.pin, e.entryId);
}

// ---- closing stock statement ----

function loadClosingStockStatus() {
  google.script.run
    .withSuccessHandler(function (list) {
      var box = $('closeStatus');
      if (!list || !list.length) { box.textContent = 'Not yet submitted.'; return; }
      var last = list[0];
      var when = last.date === todayIso() ? 'today' : last.date;
      var t = new Date(last.submittedAt);
      var hh = t.getHours(), mm = t.getMinutes();
      var stamp = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
      box.textContent = 'Last submitted ' + when + ' at ' + stamp +
        (last.submittedBy ? ' by ' + last.submittedBy : '') + ' (' + last.itemCount + ' items).';
    })
    .withFailureHandler(function (err) { $('closeStatus').textContent = errText(err); })
    .listClosingStockSubmissions(STATE.hotel, STATE.pin);
}

$('closeSubmitBtn').onclick = function () {
  $('closeSubmitBtn').disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      $('closeSubmitBtn').disabled = false;
      toast('Closing stock submitted (' + res.itemCount + ' items).');
      loadClosingStockStatus();
    })
    .withFailureHandler(function (err) {
      $('closeSubmitBtn').disabled = false;
      toast(errText(err), true);
    })
    .submitClosingStock(STATE.hotel, STATE.pin, STATE.staffName);
};

$('closePdfBtn').onclick = function () {
  var dateKey = $('closeDate').value;
  if (!dateKey) { toast('Pick a date.', true); return; }
  var btn = $('closePdfBtn');
  btn.disabled = true;
  $('closePdfStatus').textContent = 'Preparing file...';
  google.script.run
    .withSuccessHandler(function (res) {
      var bytes = atob(res.base64);
      var arr = new Uint8Array(bytes.length);
      for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      var blob = new Blob([arr], { type: res.mimeType });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = res.filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      btn.disabled = false;
      $('closePdfStatus').textContent = '';
    })
    .withFailureHandler(function (err) {
      btn.disabled = false;
      $('closePdfStatus').textContent = errText(err);
    })
    .generateClosingStockPdf(STATE.hotel, STATE.pin, dateKey);
};
</script>
